name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: Build all platforms
        run: |
          mkdir -p dist
          for goos in linux windows darwin; do
            for goarch in amd64 arm64; do
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              GOOS=$goos GOARCH=$goarch go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o "dist/kurto-${goos}-${goarch}${ext}" .
            done
          done
          GOOS=linux GOARCH=arm go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dist/kurto-linux-arm .
          GOOS=linux GOARCH=386 go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dist/kurto-linux-386 .
          GOOS=windows GOARCH=386 go build -ldflags="-X main.version=${GITHUB_REF_NAME}" -o dist/kurto-windows-386.exe .
      - name: Create archives
        run: |
          cd dist
          for f in kurto-*; do
            if [[ $f == *.exe ]]; then
              zip "${f%.exe}.zip" "$f"
            else
              gzip -c "$f" > "${f}.gz"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build NSIS installer
        run: |
          copy dist\kurto-windows-amd64.exe install\
          & "C:\Program Files (x86)\NSIS\makensis.exe" install\kurto.nsi
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: install\kurto-setup-*.exe

  release:
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp -r artifacts/binaries/* release-assets/
          cp -r artifacts/installer/* release-assets/ 2>/dev/null || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
